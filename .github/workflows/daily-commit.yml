name: Publish reviewed daily coding topic

on:
  schedule:
    # Primary: 09:00 IST (03:30 UTC); GitHub can delay or drop scheduled runs.
    - cron: '30 3 * * *'
    # Same-day recovery: 12:17 IST (06:47 UTC). Idempotency prevents a second commit.
    - cron: '47 6 * * *'
  workflow_dispatch:

# Test examples without write credentials. Grant write access only to publisher.
permissions:
  contents: read

concurrency:
  group: daily-code-journal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog and publication ledger
        run: python scripts/daily_update.py --validate
      - name: Execute offline unit and example tests
        run: python -m unittest discover -s tests -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      COMMIT_NAME: ${{ vars.COMMIT_NAME || 'Priyanshu-k23' }}
      COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || '221792233+Priyanshu-k23@users.noreply.github.com' }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish and safely push one topic
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$COMMIT_NAME" || -z "$COMMIT_EMAIL" || "$COMMIT_EMAIL" != *@* ]]; then
            echo 'ERROR: COMMIT_NAME/COMMIT_EMAIL are invalid. Configure repository variables.' >&2
            exit 1
          fi
          git config --local user.name "$COMMIT_NAME"
          git config --local user.email "$COMMIT_EMAIL"
          export GIT_AUTHOR_NAME="$COMMIT_NAME"
          export GIT_AUTHOR_EMAIL="$COMMIT_EMAIL"
          export GIT_COMMITTER_NAME="$COMMIT_NAME"
          export GIT_COMMITTER_EMAIL="$COMMIT_EMAIL"
          git config --local commit.gpgsign false
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null

          # Rejected pushes are regenerated from remote HEAD, never blindly rebased.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt / 3"
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            # This checkout is disposable. Reset rejected local commits on retry,
            # including their generated files, before regenerating from remote HEAD.
            git reset --hard "origin/$DEFAULT_BRANCH"
            git clean -fd
            git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
            python scripts/daily_update.py
            if [[ "$(git status --porcelain)" == "" ]]; then
              echo 'No new files for today (already published or library exhausted).'
              exit 0
            fi

            # Stage only expected output; refuse all other changes.
            NOTE_PATH="$(python -c 'import json; print(json.load(open("data/published.json", encoding="utf-8"))["entries"][-1]["path"])')"
            TODAY_IST="$(python -c 'import json; print(json.load(open("data/published.json", encoding="utf-8"))["entries"][-1]["date_ist"])')"
            git add -- README.md data/published.json "$NOTE_PATH"
            count=0
            while IFS=$'\t' read -r status file; do
              count=$((count + 1))
              case "${status}:${file}" in
                'M:README.md'|'M:data/published.json') ;;
                "A:${NOTE_PATH}") ;;
                *) echo "ERROR: Unexpected staged change: $status $file" >&2; exit 1 ;;
              esac
            done < <(git diff --cached --name-status)
            if [[ "$count" -ne 3 ]]; then
              echo "ERROR: Expected exactly 3 changes (README, ledger, note); found $count." >&2
              exit 1
            fi

            git commit -m "docs: publish reviewed learning topic on ${TODAY_IST} IST [automated]"
            if git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"; then
              echo 'Published to the default branch successfully.'
              exit 0
            fi
            echo 'WARNING: Push failed (concurrent update, permission, or branch protection). Retrying from remote head.' >&2
          done
          echo 'ERROR: Push failed after 3 attempts. Check workflow logs, token write permission, and branch protection.' >&2
          exit 1
